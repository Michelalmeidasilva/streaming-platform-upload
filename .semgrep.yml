# Semgrep configuration for streaming-platform-upload
# Security, type safety, and code quality rules for Node.js/TypeScript
#
# Note: Using simplified rules that work reliably in pre-commit environment
# For comprehensive registry rules, run: semgrep --config=p/owasp-top-ten,p/security-audit,p/typescript,p/nodejs
#
# Key rule categories checked locally:
#   - Hardcoded credentials (complement to gitleaks hook)
#   - Common security patterns
#   - Type safety issues

rules:
  # Detect hardcoded API keys in environment variables
  - id: hardcoded-api-keys
    patterns:
      - pattern-either:
          - pattern: |
              const $VAR = $VALUE
              ...
              $VAR
          - pattern: |
              API_KEY = $VALUE
          - pattern: |
              SECRET = $VALUE
    message: Potential hardcoded credentials detected
    languages: [javascript, typescript]
    severity: ERROR

paths:
  exclude:
    # Test directories and patterns
    - tests
    - __tests__
    - "*.test.ts"
    - "*.spec.ts"
    - "*.test.tsx"
    - "*.spec.tsx"
    - "*.test.js"
    - "*.spec.js"
    # Test output and reports
    - coverage
    - playwright-report
    - test-results
    # Build outputs and dependencies
    - node_modules
    - dist
    - build
    - .next
