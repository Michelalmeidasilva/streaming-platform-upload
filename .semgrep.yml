# Semgrep configuration for streaming-platform-upload
# Security, type safety, and code quality rules for Node.js/TypeScript
#
# Rule sets:
#   - p/owasp-top-ten: OWASP web vulnerabilities (XSS, CSRF, injection, etc)
#   - p/security-audit: Hardcoded secrets, unsafe crypto, dangerous patterns
#   - p/typescript: Type safety violations and best practices
#   - p/nodejs: Node.js and Express-specific security issues
#
# This configuration is prepared for integration with the pre-commit hook
# (see Task 2: updating .pre-commit-config.yaml)

rules: []

extends:
  - p/owasp-top-ten
  - p/security-audit
  - p/typescript
  - p/nodejs

paths:
  exclude:
    # Test locations
    - tests
    - __tests__
    - "*.test.ts"
    - "*.spec.ts"
    - "*.test.tsx"
    - "*.spec.tsx"
    - "*.test.js"
    - "*.spec.js"
    # Test output and reports
    - coverage
    - playwright-report
    - test-results
    # Build outputs and dependencies
    - node_modules
    - dist
    - build
    - .next
