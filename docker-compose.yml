services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - STORAGE_PROVIDER=minio
      - STORAGE_BUCKET=videos
      - MINIO_ENDPOINT=http://host.docker.internal:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  minio-data:
