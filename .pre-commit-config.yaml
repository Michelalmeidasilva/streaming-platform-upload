# Shift-Left: Execução local antes do push
# Pre-commit framework configuration for streaming-platform-upload
# Install hooks: pre-commit install
# Run manually: pre-commit run --all-files
# Skip for a commit: git commit --no-verify

repos:
  # Standard pre-commit hooks: trailing-whitespace, EOF handling, YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=10000']

  # Detect hardcoded secrets (API keys, credentials, etc.)
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
        description: Detect hardcoded secrets prior to commit

  # Security & code quality scanning with semgrep
  # Checks for OWASP vulnerabilities, type safety, and Node.js-specific issues
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.45.0
    hooks:
      - id: semgrep
        args: ['--config=p/owasp-top-ten', '--config=p/security-audit', '--config=p/typescript', '--config=p/nodejs', '--error']
        types_or: [ts, tsx, javascript, json]
        description: Run semgrep security and code quality checks

  # Node.js linting (ESLint)
  # Note: TypeScript checking and Jest unit tests are run by scripts/pre-commit.sh
  - repo: local
    hooks:
      - id: npm-lint
        name: Lint with ESLint
        entry: bash -c 'npm run lint'
        language: system
        types_or: [javascript, ts, tsx, json]
        pass_filenames: false
